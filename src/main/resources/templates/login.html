<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — DemandWise</title><style>body{font:16px Arial;background:#f2f5f7;display:grid;place-items:center;height:100vh;margin:0}.card{background:white;padding:2rem;border-radius:12px;width:min(360px,85vw);box-shadow:0 8px 30px #18304420}label{display:block;margin:1rem 0 .3rem}input{box-sizing:border-box;width:100%;padding:.7rem}button{margin-top:1.2rem;width:100%;padding:.8rem;background:#087e78;color:white;border:0;border-radius:6px;font-size:1rem}.erro{color:#a21d25}</style></head><body><main class="card"><h1>DemandWise</h1><p>Entre para acessar os projetos.</p><p class="erro" th:if="${erro}" th:text="${erro}"></p><form method="post" action="/login"><label for="usuario">Usuário</label><input id="usuario" name="usuario" required autocomplete="username"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"><button type="submit">Entrar</button></form></main></body></html>
