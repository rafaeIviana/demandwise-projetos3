<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto não encontrado — DemandWise</title>
    <link rel="stylesheet" th:href="@{/css/envio.css}">
    <link rel="stylesheet" th:href="@{/css/analista.css(v='20261104-1')}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <a class="marca" th:href="@{/envio}"><span class="marca-icone">D</span><span>Demand<span class="marca-destaque">Wise</span></span></a>
        <p class="nav-titulo">WORKSPACE</p>
        <nav class="navegacao" aria-label="Navegação principal">
            <a class="nav-item" th:href="@{/envio}"><span class="nav-icone">▦</span>Novo projeto</a>
            <a class="nav-item ativo" th:href="@{/analista/projetos}"><span class="nav-icone">▤</span>Projetos pré-validados</a>
        </nav>
    </aside>
    <main class="conteudo">
        <header class="topbar"><div class="breadcrumb"><a th:href="@{/analista/projetos}">Projetos</a><span class="breadcrumb-separador">/</span><strong>Não encontrado</strong></div></header>
        <div class="pagina">
            <section class="estado-vazio estado-nao-encontrado">
                <span class="estado-vazio-icone" aria-hidden="true">?</span>
                <h1>Projeto não encontrado</h1>
                <p th:text="|Não foi possível localizar o projeto #${id}. Ele pode não estar mais disponível nesta sessão.|">Não foi possível localizar este projeto.</p>
                <a class="btn-principal" th:href="@{/analista/projetos}">Voltar à listagem</a>
            </section>
        </div>
    </main>
</div>
</body>
</html>
